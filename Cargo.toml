[package]
name = "ytdlp_gui"
version = "0.2.0"
edition = "2021"
repository = "https://github.com/amd64fox/ytdlp-ui"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "links"] }
arboard = "3.3"
reqwest = { version = "0.11", features = ["blocking", "json", "rustls-tls"] }
zip = "0.6"
semver = "1"
serde_json = "1"
sha2 = "0.10"
encoding_rs = "0.8"
rfd = "0.15"

# --- ДЛЯ КОНФИГА ---
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
] }
