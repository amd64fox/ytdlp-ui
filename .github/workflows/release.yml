name: Build and release Windows x64

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = $metadata.packages[0].version
          $expectedTag = "v$version"
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { $expectedTag }

          if ($tag -ne $expectedTag) {
            throw "Tag $tag does not match Cargo version $version"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/ytdlp_gui.exe dist/ytdlp-ui-x64.exe

          $hash = (Get-FileHash dist/ytdlp-ui-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path (Resolve-Path dist) "SHA256SUMS.txt"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($checksumPath, "$hash  ytdlp-ui-x64.exe`n", $utf8NoBom)

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:RELEASE_TAG *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG dist/ytdlp-ui-x64.exe dist/SHA256SUMS.txt --clobber
          } else {
            gh release create $env:RELEASE_TAG dist/ytdlp-ui-x64.exe dist/SHA256SUMS.txt `
              --target $env:GITHUB_SHA `
              --title $env:RELEASE_TAG `
              --generate-notes
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish release $env:RELEASE_TAG"
          }
